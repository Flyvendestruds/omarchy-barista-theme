[launcher]
# App launcher overlay (SUPER+SPACE). scrim = fullscreen dim behind the
# card; background = the card. selected-* = highlighted row.
background                = "#ffffff"
background-alpha          = 1
text                      = "#4c4f69"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#ffffff"
scrim-alpha               = 0.5
selected-background       = "#4c4f69"
selected-background-alpha = 0.08
selected-text             = "#0066cc"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.25
