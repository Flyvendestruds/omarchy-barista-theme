[polkit]
# Sudo/password prompt. text-error = wrong-password tint. accent = lock
# glyph color + text-selection tint inside the prompt.
background       = "#ffffff"
background-alpha = 1.0
text             = "#333333"
text-error       = "#d20f39"
border           = "hyprland.active-border"
border-error     = "#d20f39"
border-alpha     = 1.0
scrim            = "#ffffff"
scrim-alpha      = 0.0
# accent is the lock-icon glyph color + text-selection tint.
accent           = "#0066cc"
