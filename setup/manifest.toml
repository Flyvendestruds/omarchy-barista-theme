# barista setup manifest: ordered steps, each idempotent with apply|revert.
# setup.sh runs them in numeric order. To add a behavior: drop a new
# NN-name.sh step here, register it below, no orchestrator changes needed.
steps:
  - id: shell-shadows
    file: steps/10-shell-shadows.sh
    needs_root: true
    description: QML card shadows (BorderSurface + Style + card opt-ins + template default)
  - id: hypr-chrome
    file: steps/20-hypr-chrome.sh
    needs_root: false
    description: single-window-no-border + bar-aware gaps lua + hyprland.lua requires
  - id: bar-gap
    file: steps/30-bar-gap.sh
    needs_root: false
    description: bar transparency gap watcher (bin scripts + user service + boot/theme hooks)
  - id: theme-dev
    file: steps/40-theme-dev.sh
    needs_root: false
    description: live-edit loop (tokens-apply + watcher units, dev-only)
  - id: update-hook
    file: steps/50-update-hook.sh
    needs_root: false
    description: post-update repair (re-run shell-shadows + notify)
  - id: panel-switch
    file: steps/60-panel-switch.sh
    needs_root: true
    description: one-click panel switch (forward bar clicks across widgets while a panel is open)
  - id: panel-morph
    file: steps/61-panel-morph.sh
    needs_root: true
    description: morph between panels (new card reshapes from the old one, content fades in late)
  - id: weather
    file: steps/70-weather.sh
    needs_root: false
    optional: true
    description: barista weather add-on (installs + enables omarchy-barista-weather plugin)
